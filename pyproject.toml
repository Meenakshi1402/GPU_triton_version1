[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-blackjack-triton"
version = "0.1.0"
description = "BCG-style GPU Blackjack in Triton (no GA), with true rules, timing, and CLI."
readme = "README.md"
license = {text = "MIT"}
authors = [{name="Your Name", email="you@example.com"}]
requires-python = ">=3.9"
dependencies = ["torch", "triton"]

[project.scripts]
gbj-bench = "gpubj.runner:cli"

# Tell setuptools where packages live (src layout)
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
