[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-blackjack-triton"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch", "triton"]

[project.scripts]
gbj-bench = "gpubj.runner:cli"

# Tell setuptools where packages live (src layout)
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
